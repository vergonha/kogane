name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64       
        run: go build -trimpath -ldflags="-s -w" -o build/server ./cmd/server

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload binary and assets
        env:
          SSH: ssh -i ~/.ssh/id_deploy
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          rsync -az -e "$SSH" build/server "$TARGET:/opt/manga/server.new"
          rsync -az --delete -e "$SSH" static/    "$TARGET:/opt/manga/static/"
          rsync -az --delete -e "$SSH" templates/ "$TARGET:/opt/manga/templates/"

      - name: Swap and restart
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /opt/manga
            chmod +x server.new
            sudo /usr/bin/systemctl stop manga
            mv server.new server
            sudo /usr/bin/systemctl start manga
            sleep 3
            systemctl is-active --quiet manga || { journalctl -u manga -n 50 --no-pager; exit 1; }
          '