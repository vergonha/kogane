name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # weekly, catches newly-disclosed cves in deps you havent touched
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  gosec:
    name: Static analysis (gosec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  osv-scan:
    name: Dependency CVE scan (OSV-Scanner)
    permissions:
      contents: read
      actions: read          
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    with:
      scan-args: |-
        --output=results.sarif
        --format=sarif
        ./