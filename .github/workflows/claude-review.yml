name: Claude Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          display_report: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.

            Read CLAUDE.md first, then read the relevant
            files under .claude/rules/.

            Follow the repository's engineering rules exactly.

            Focus on:
            - architecture
            - go simplicity
            - error handling
            - concurrency
            - security
            - input boundaries
            - typing
            - testing
            - unnecessary abstraction
            - pass-through layers

            Review the actual diff and inspect surrounding code
            when necessary.

            Report only actionable, high-confidence findings.
            Do not manufacture issues.

            For each finding, explain:
            1. what is wrong
            2. why it matters
            3. where it occurs
            4. how it should be fixed

            If there are no actionable findings, say so explicitly.
