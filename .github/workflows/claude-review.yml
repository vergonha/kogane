name: Claude Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          display_report: true
          track_progress: true
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.

            Read CLAUDE.md first, then read the relevant
            files under .claude/rules/.

            Follow the repository's engineering rules exactly.

            Focus on:
            - architecture
            - go simplicity
            - error handling
            - concurrency
            - security
            - input boundaries
            - typing
            - testing
            - unnecessary abstraction
            - pass-through layers

            Review the actual diff and inspect surrounding code
            when necessary.

            Only report actionable, high-confidence findings.
            Do not manufacture issues.

            IMPORTANT: the review only exists once it is posted to the PR.
            the final response is not the review.

            there must always be exactly one PR-level comment.

            inline comments are for specific problems in specific lines.
            post one per finding on the relevant changed line, explaining
            what is wrong, why it matters, and what to change.

            the PR-level comment:
            - with findings: a couple of lines on what the diff does and
              what came out of the review. do not repeat the inline
              comments, do not list everything that was checked.
            - with no findings: the entire body is exactly "lgtm", nothing
              else.

            follow .claude/rules/writing.md: lowercase, no emojis, no
            filler, no praise.

            do not finish without posting the PR-level comment.
