name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request according to the repository's
            engineering rules.

            First, read CLAUDE.md and the relevant files under
            .claude/rules/.

            For this Go codebase, pay particular attention to:

            - architecture and unnecessary abstraction
            - error handling
            - concurrency and context usage
            - untrusted input at system boundaries
            - type safety
            - testing quality
            - unnecessary helpers and pass-through layers
            - security regressions
            - deviations from the repository's existing architecture

            Follow the rules in the repository rather than inventing
            alternative conventions.

            Review the actual diff and surrounding code when necessary.

            Only report actionable findings.
            Do not suggest changes merely because you would personally
            implement the code differently.

            Prioritize findings by severity:
            - Critical
            - High
            - Medium
            - Low

            For each finding, explain:
            1. what is wrong
            2. why it matters
            3. where it occurs
            4. how it should be fixed

            If the PR is correct, say so briefly.
            Do not manufacture findings.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
