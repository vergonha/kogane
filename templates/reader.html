<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="apple-touch-icon" sizes="180x180" href="/ap0/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/ap0/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/ap0/favicon-16x16.png">
  <link rel="manifest" href="/ap0/site.webmanifest">

  <meta name="description" content="are you going to see the rose in the vase or the dust on the table?">
  <meta property="og:title" content="a̵̢͉͋̈p̶̘͖̦̌́̀0̵̠̼̙͌̒͠c̵̢̣̆ǎ̶͉͖͙̿l̵͖͕̅y̵̼̮̍̇p̸̨͇̌̒̑ṣ̷̯̾ė̶̘̪̊">
  <meta property="og:description" content="are you going to see the rose in the vase or the dust on the table?">
  <meta property="og:url" content="https://ap0calypse.rengar.dev/">
  <meta property="og:site_name" content="晋升">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://i.pinimg.com/736x/ff/de/99/ffde9907b71c9a44f00b9034f5197f58.jpg">
  <meta property="og:image:width" content="150">
  <meta property="og:image:height" content="150">
  <meta property="og:image:alt" content="ap0calypse.rengar.dev logo">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="晋升">
  <meta name="twitter:description" content="are you going to see the rose in the vase or the dust on the table?">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes loading-bar {
      0% {
        transform: translateX(-140%);
      }

      100% {
        transform: translateX(340%);
      }
    }

    .progress-loading {
      position: relative;
      overflow: hidden;
    }

    .progress-loading #progressBar {
      width: 100% !important;
      background: transparent;
    }

    .progress-loading #progressBar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 30%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
      animation: loading-bar 1.1s linear infinite;
    }
  </style>
</head>

<body
  class="bg-[#181818] text-[#8e8e8e] font-mono min-h-screen flex flex-col justify-between selection:bg-neutral-700 selection:text-white">
  <header class="sticky top-0 z-50 w-full bg-[#181818]/90 backdrop-blur-md border-b border-neutral-800/60">
    <div class="flex flex-col gap-3 px-4 py-3 text-xs sm:flex-row sm:items-center sm:justify-between sm:px-6 sm:py-4">
      <div class="flex items-center justify-between gap-3 sm:contents">
        <a href="/dashboard" class="shrink-0 text-neutral-500 hover:text-neutral-300 transition">← back</a>
        <span class="block text-neutral-300 font-bold truncate max-w-full sm:max-w-[40vw]">
          {{.Title}} / Volume {{printf "%02s" .Vol}}
        </span>
      </div>

      <div class="flex items-center justify-center gap-3 sm:gap-4 sm:justify-between">
        <div class="flex items-center gap-2 border border-neutral-800 rounded px-2 py-1 bg-neutral-900/30">
          <button id="zoomOut" class="text-neutral-500 hover:text-neutral-300 px-1 font-bold focus:outline-none"
            title="Zoom Out">-[z]</button>
          <span id="zoomLevel" class="text-neutral-400 select-none min-w-[2.5rem] text-center">100%</span>
          <button id="zoomIn" class="text-neutral-500 hover:text-neutral-300 px-1 font-bold focus:outline-none"
            title="Zoom In">+[x]</button>
        </div>
        <div class="flex items-center gap-1.5 text-neutral-500 shrink-0 select-none">
          <input id="pageInput" type="number" min="1"
            class="w-10 bg-neutral-900/50 border border-neutral-800/80 rounded text-center py-0.5 text-neutral-300 focus:outline-none focus:border-neutral-600 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none text-xs" />
          <span>/</span>
          <span id="totalPages" class="min-w-[1.5rem]">0</span>
        </div>
      </div>
    </div>

    <div class="w-full bg-[#181818]/95">
      <div id="loadingText"
        class="hidden px-4 py-2 text-[11px] tracking-wider text-neutral-300 border-t border-neutral-800/40 sm:px-6">
        fetching pages...
      </div>
      <div id="progressTrack" class="h-1.5 w-full bg-neutral-900/80 overflow-hidden relative">
        <div id="progressBar" class="h-full w-0 bg-neutral-300 transition-[width] duration-300 ease-out"></div>
      </div>
    </div>
  </header>

  <main id="readerContainer"
    class="flex-grow flex flex-col items-center py-4 sm:py-6 gap-4 sm:gap-6 overflow-y-auto overflow-x-auto w-full px-2 sm:px-4 cursor-pointer select-none">
    <div id="pagesWrapper" class="flex flex-col items-center gap-4 transition-all duration-200"></div>
  </main>


  <script>
    window.READER_CONFIG = {
      title: {{.Title | js}},
      vol: {{.Vol | js}},
      csrf: {{.CSRFToken | js}},
      mangadexId: {{.MangaDexID | js}},
    };
  </script>
  <script type="module" src="/ap0/js/reader.js"></script>
</body>

</html>
