<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — {{.Vol}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Esconde barra de rolagem mas mantém funcionalidade */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-[#181818] text-[#8e8e8e] font-mono min-h-screen flex flex-col justify-between selection:bg-neutral-700 selection:text-white">

  <header class="w-full flex justify-between items-center px-6 py-4 bg-[#181818]/90 backdrop-blur-md border-b border-neutral-800/60 sticky top-0 z-50 text-xs">
    <a href="/" class="text-neutral-500 hover:text-neutral-300 transition">← voltar</a>
    
    <span class="text-neutral-300 font-bold truncate max-w-[40vw]">
      {{.Title}} / Volume {{printf "%02s" .Vol}}
    </span>

    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 border border-neutral-800 rounded px-2 py-1 bg-neutral-900/30">
        <button id="zoomOut" class="text-neutral-500 hover:text-neutral-300 px-1 font-bold focus:outline-none" title="Diminuir Zoom">-[z]</button>
        <span id="zoomLevel" class="text-neutral-400 select-none min-w-[2.5rem] text-center">100%</span>
        <button id="zoomIn" class="text-neutral-500 hover:text-neutral-300 px-1 font-bold focus:outline-none" title="Aumentar Zoom">+[x]</button>
      </div>
      <span id="pageIndicator" class="text-neutral-500 min-w-[3.5rem] text-right">0 / 0</span>
    </div>
  </header>

  <main id="readerContainer" class="flex-grow flex flex-col items-center py-6 gap-6 overflow-y-auto w-full px-4">
    <div id="pagesWrapper" class="flex flex-col items-center gap-4 transition-all duration-200" style="width: 100%; max-width: 720px;">
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.worker.min.mjs';

    const title = {{.Title | js}};
    const vol   = {{.Vol   | js}};
    const url   = `/pdf?title=${encodeURIComponent(title)}&vol=${encodeURIComponent(vol)}`;
    
    const storageKey = `progress::${title}::${vol}`;

    const wrapper = document.getElementById('pagesWrapper');
    const pageIndicator = document.getElementById('pageIndicator');
    const zoomIn = document.getElementById('zoomIn');
    const zoomOut = document.getElementById('zoomOut');
    const zoomLevelText = document.getElementById('zoomLevel');

    let pdf = null;
    let totalPages = 0;
    let renderQueue = new Set();
    const renderedPages = new Map(); // Guarda estado de render de cada página

    const zoomSteps = [50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150];
    let zoomIndex = 5; 

    try {
      pdf = await pdfjsLib.getDocument(url).promise;
      totalPages = pdf.numPages;
      initReader();
    } catch (err) {
      console.error("Erro ao carregar o PDF:", err);
    }

    function initReader() {
      for (let i = 1; i <= totalPages; i++) {
        const pageContainer = document.createElement('div');
        pageContainer.id = `page-container-${i}`;
        pageContainer.className = 'w-full flex justify-center relative bg-neutral-900/10 border border-neutral-900/40 rounded overflow-hidden min-h-[500px]';
        pageContainer.dataset.page = i;

        const canvas = document.createElement('canvas');
        canvas.id = `canvas-${i}`;
        canvas.className = 'shadow-xl max-w-full';
        
        pageContainer.appendChild(canvas);
        wrapper.appendChild(pageContainer);
      }

      const savedPage = parseInt(localStorage.getItem(storageKey)) || 1;
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const pageNum = parseInt(entry.target.dataset.page);
          if (entry.isIntersecting) {
            triggerRender(pageNum);
            updateProgress(pageNum);
          } else {
            cancelRender(pageNum);
          }
        });
      }, {
        root: null,
        rootMargin: '100% 0px 100% 0px', 
        threshold: 0.1
      });

      document.querySelectorAll('[data-page]').forEach(el => observer.observe(el));

      if (savedPage > 1) {
        setTimeout(() => {
          const targetEl = document.getElementById(`page-container-${savedPage}`);
          if (targetEl) targetEl.scrollIntoView({ behavior: 'auto', block: 'start' });
        }, 150);
      }
    }

    async function triggerRender(num) {
      if (renderedPages.get(num) === 'rendered' || renderQueue.has(num)) return;
      renderQueue.add(num);

      try {
        const page = await pdf.getPage(num);
        const canvas = document.getElementById(`canvas-${num}`);
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        
        const wrapperWidth = wrapper.clientWidth;
        const rawViewport = page.getViewport({ scale: 1 });
        const scale = (wrapperWidth / rawViewport.width) * dpr;
        const viewport = page.getViewport({ scale });

        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = `${viewport.width / dpr}px`;
        canvas.style.height = `${viewport.height / dpr}px`;

        const container = document.getElementById(`page-container-${num}`);
        if (container) container.style.minHeight = `${viewport.height / dpr}px`;

        await page.render({ canvasContext: ctx, viewport }).promise;
        renderedPages.set(num, 'rendered');
      } catch (err) {
        console.warn(`Render cancelado/falhou na página ${num}`, err);
      } finally {
        renderQueue.delete(num);
      }
    }

    function cancelRender(num) {
      if (renderedPages.get(num) === 'rendered') {
        const canvas = document.getElementById(`canvas-${num}`);
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.width = 0;
          canvas.height = 0;
        }
        renderedPages.set(num, 'idle');
      }
    }

    function updateProgress(num) {
      pageIndicator.textContent = `${num} / ${totalPages}`;
      localStorage.setItem(storageKey, num);
    }

    function applyZoom() {
      const zoom = zoomSteps[zoomIndex];
      zoomLevelText.textContent = `${zoom}%`;
      wrapper.style.maxWidth = `${720 * (zoom / 100)}px`;
      
      renderedPages.clear();
      document.querySelectorAll('[data-page]').forEach(container => {
        const pageNum = parseInt(container.dataset.page);
        const rect = container.getBoundingClientRect();
        if (rect.top < window.innerHeight && rect.bottom > 0) {
          triggerRender(pageNum);
        }
      });
    }

    zoomIn.addEventListener('click', () => {
      if (zoomIndex < zoomSteps.length - 1) {
        zoomIndex++;
        applyZoom();
      }
    });

    zoomOut.addEventListener('click', () => {
      if (zoomIndex > 0) {
        zoomIndex--;
        applyZoom();
      }
    });

    // Atalhos de teclado (Zoom e Scroll rápido)
    document.addEventListener('keydown', e => {
      if (e.key === 'x' || e.key === 'X') zoomIn.click();
      if (e.key === 'z' || e.key === 'Z') zoomOut.click();
    });

    // Re-renderiza se a janela mudar drasticamente de tamanho
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        renderedPages.clear();
        applyZoom();
      }, 200);
    });
  </script>

</body>

</html>
