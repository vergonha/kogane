  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes loading-bar {
      0%   { transform: translateX(-140%); }
      100% { transform: translateX(340%); }
    }

    .progress-loading { position: relative; overflow: hidden; }
    .progress-loading #progressBar { width: 100% !important; background: transparent; }
    .progress-loading #progressBar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 30%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
      animation: loading-bar 1.1s linear infinite;
    }
  </style>
</head>

<body class="bg-[#181818] text-[#8e8e8e] font-mono min-h-screen flex flex-col justify-between selection:bg-neutral-700 selection:text-white">
  <header class="sticky top-0 z-50 w-full bg-[#181818]/90 backdrop-blur-md border-b border-neutral-800/60">
    <div class="flex flex-col gap-3 px-4 py-3 text-xs sm:flex-row sm:items-center sm:justify-between sm:px-6 sm:py-4">
      <div class="flex items-center justify-between gap-3 sm:contents">
        <a href="/dashboard" class="shrink-0 text-neutral-500 hover:text-neutral-300 transition">← voltar</a>
        <span class="block text-neutral-300 font-bold truncate max-w-full sm:max-w-[40vw]">
          {{.Title}} / Volume {{printf "%02s" .Vol}}
        </span>
      </div>

      <div class="flex items-center justify-center gap-3 sm:gap-4 sm:justify-between">
        <div class="flex items-center gap-2 border border-neutral-800 rounded px-2 py-1 bg-neutral-900/30">
          <button id="zoomOut" class="text-neutral-500 hover:text-neutral-300 px-1 font-bold focus:outline-none" title="Diminuir Zoom">-[z]</button>
          <span id="zoomLevel" class="text-neutral-400 select-none min-w-[2.5rem] text-center">100%</span>
          <button id="zoomIn" class="text-neutral-500 hover:text-neutral-300 px-1 font-bold focus:outline-none" title="Aumentar Zoom">+[x]</button>
        </div>
        <span id="pageIndicator" class="text-neutral-500 min-w-[3.5rem] text-right shrink-0">0 / 0</span>
      </div>
    </div>

    <div class="w-full bg-[#181818]/95">
      <div id="loadingText" class="hidden px-4 py-2 text-[11px] tracking-wider text-neutral-300 border-t border-neutral-800/40 sm:px-6">
        buscando páginas...
      </div>
      <div id="progressTrack" class="h-1.5 w-full bg-neutral-900/80 overflow-hidden relative">
        <div id="progressBar" class="h-full w-0 bg-neutral-300 transition-[width] duration-300 ease-out"></div>
      </div>
    </div>
  </header>

  <main id="readerContainer" class="flex-grow flex flex-col items-center py-4 sm:py-6 gap-4 sm:gap-6 overflow-y-auto w-full px-2 sm:px-4">
    <div id="pagesWrapper" class="flex flex-col items-center gap-4 transition-all duration-200" style="width: 100%; max-width: 720px;"></div>
  </main>

  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.worker.min.mjs';

    const title       = {{.Title | js}};
    const vol         = {{.Vol | js}};
    const CSRF        = {{.CSRFToken | js}};
    const MANGADEX_ID = {{.MangaDexID | js}};

    const wrapper       = document.getElementById('pagesWrapper');
    const pageIndicator = document.getElementById('pageIndicator');
    const zoomInBtn     = document.getElementById('zoomIn');
    const zoomOutBtn    = document.getElementById('zoomOut');
    const zoomLevelEl   = document.getElementById('zoomLevel');
    const progressBar   = document.getElementById('progressBar');
    const progressTrack = document.getElementById('progressTrack');
    const loadingText   = document.getElementById('loadingText');

    const ZOOM_STEPS = [50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150];
    let zoomIndex = 5;

    /** @type {Map<number, 'rendered'|'idle'>} */
    const renderedPages = new Map();
    const renderQueue   = new Set();
    let saveTimer;
    let pdf;

    setLoading(true);

    try {
      pdf = await pdfjsLib.getDocument(
        `/pdf?title=${encodeURIComponent(title)}&vol=${encodeURIComponent(vol)}`
      ).promise;

      buildPages(pdf.numPages);

      const savedPage = await fetchProgress();
      initObserver(savedPage);
      setLoading(false);
    } catch (err) {
      console.error('Erro ao carregar PDF:', err);
      showError();
    }

    function buildPages(total) {
      const frag = document.createDocumentFragment();
      for (let i = 1; i <= total; i++) {
        const div    = document.createElement('div');
        div.id       = `page-container-${i}`;
        div.dataset.page = i;
        div.className = 'w-full';

        const canvas    = document.createElement('canvas');
        canvas.id       = `canvas-${i}`;
        canvas.className = 'w-full block';

        div.appendChild(canvas);
        frag.appendChild(div);
      }
      wrapper.appendChild(frag);
    }

    async function fetchProgress() {
      if (!MANGADEX_ID) return 1;
      try {
        const res = await fetch(`/api/progress/${MANGADEX_ID}`);
        if (!res.ok) return 1;
        const data = await res.json();
        return String(data.Volume) === String(vol) ? (data.Page ?? 1) : 1;
      } catch {
        return 1;
      }
    }

    function saveProgress(page) {
      if (!MANGADEX_ID) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        fetch('/api/progress', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
          body: JSON.stringify({ mangadex_id: MANGADEX_ID, volume: vol, page }),
        }).catch(() => {});
      }, 1500);
    }

    async function triggerRender(num) {
      if (renderedPages.get(num) === 'rendered' || renderQueue.has(num)) return;
      renderQueue.add(num);

      try {
        const page   = await pdf.getPage(num);
        const canvas = document.getElementById(`canvas-${num}`);
        if (!canvas) return;

        const dpr      = window.devicePixelRatio || 1;
        const rawVp    = page.getViewport({ scale: 1 });
        const scale    = (wrapper.clientWidth / rawVp.width) * dpr;
        const viewport = page.getViewport({ scale });

        canvas.width        = viewport.width;
        canvas.height       = viewport.height;
        canvas.style.width  = `${viewport.width / dpr}px`;
        canvas.style.height = `${viewport.height / dpr}px`;

        document
          .getElementById(`page-container-${num}`)
          ?.style.setProperty('min-height', `${viewport.height / dpr}px`);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        renderedPages.set(num, 'rendered');
      } catch (err) {
        console.warn(`Render falhou na página ${num}`, err);
      } finally {
        renderQueue.delete(num);
      }
    }

    function cancelRender(num) {
      if (renderedPages.get(num) !== 'rendered') return;
      const canvas = document.getElementById(`canvas-${num}`);
      if (canvas) {
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        canvas.width  = 0;
        canvas.height = 0;
      }
      renderedPages.set(num, 'idle');
    }

    function initObserver(savedPage) {
      updateProgress(savedPage);

      const observer = new IntersectionObserver(
        entries => {
          for (const entry of entries) {
            const num = parseInt(entry.target.dataset.page);
            if (entry.isIntersecting) {
              triggerRender(num);
              updateProgress(num);
            } else {
              cancelRender(num);
            }
          }
        },
        { rootMargin: '100% 0px 100% 0px', threshold: 0.1 }
      );

      document.querySelectorAll('[data-page]').forEach(el => observer.observe(el));

      if (savedPage > 1) {
        setTimeout(() => {
          document
            .getElementById(`page-container-${savedPage}`)
            ?.scrollIntoView({ behavior: 'auto', block: 'start' });
        }, 150);
      }
    }

    function updateProgress(num) {
      pageIndicator.textContent = `${num} / ${pdf.numPages}`;
      saveProgress(num);
      const pct = Math.max(0, Math.min(100, (num / pdf.numPages) * 100));
      progressBar.style.width = `${pct}%`;
    }

    function applyZoom() {
      const zoom = ZOOM_STEPS[zoomIndex];
      zoomLevelEl.textContent    = `${zoom}%`;
      wrapper.style.maxWidth     = `${720 * (zoom / 100)}px`;
      renderedPages.clear();

      document.querySelectorAll('[data-page]').forEach(el => {
        const { top, bottom } = el.getBoundingClientRect();
        if (top < window.innerHeight && bottom > 0) {
          triggerRender(parseInt(el.dataset.page));
        }
      });
    }

    function setLoading(on) {
      loadingText.classList.toggle('hidden', !on);
      progressTrack.classList.toggle('progress-loading', on);
      if (on) pageIndicator.textContent = '...';
    }

    function showError() {
      loadingText.textContent = 'ERRO AO CARREGAR PDF';
      loadingText.classList.remove('hidden');
      progressTrack.classList.remove('progress-loading');
      progressBar.style.width = '100%';
      progressBar.classList.replace('bg-neutral-300', 'bg-red-400');
    }

    zoomInBtn.addEventListener('click', () => {
      if (zoomIndex < ZOOM_STEPS.length - 1) { zoomIndex++; applyZoom(); }
    });
    zoomOutBtn.addEventListener('click', () => {
      if (zoomIndex > 0) { zoomIndex--; applyZoom(); }
    });

    document.addEventListener('keydown', ({ key }) => {
      if (key === 'x' || key === 'X') zoomInBtn.click();
      if (key === 'z' || key === 'Z') zoomOutBtn.click();
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { renderedPages.clear(); applyZoom(); }, 200);
    });
  </script>
</body>

</html>
