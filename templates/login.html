<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MangaLib</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen">
  <form method="POST" action="/login"
        class="bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-sm space-y-4">
    <h1 class="text-2xl font-bold text-center">📚 MangaLib</h1>
    <div>
      <label class="block text-sm text-gray-400 mb-1">Usuário</label>
      <input name="username" type="text" required autofocus
             class="w-full bg-gray-800 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1">Senha</label>
      <input name="password" type="password" required
             class="w-full bg-gray-800 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-500 transition py-2 rounded-lg font-semibold">
      Entrar
    </button>
  </form>
</body>
</html>
