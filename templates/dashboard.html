<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca — MangaLib</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6">
  <header class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-bold">📚 Minha Biblioteca</h1>
    <form method="POST" action="/logout">
      <button class="text-sm text-gray-400 hover:text-white transition">Sair</button>
    </form>
  </header>

  <div class="space-y-8">
    {{range .}}
    <section>
      <h2 class="text-xl font-semibold text-indigo-400 mb-3">{{.Title}}</h2>
      <div class="flex flex-wrap gap-3">
        {{$title := .Title}}
        {{range .Volumes}}
        <a href="/read?title={{$title}}&vol={{.}}"
           class="bg-gray-800 hover:bg-gray-700 transition px-4 py-2 rounded-lg text-sm">
          {{.}}
        </a>
        {{end}}
      </div>
    </section>
    {{else}}
    <p class="text-gray-500">Nenhum mangá encontrado em /data.</p>
    {{end}}
  </div>
</body>
</html>
